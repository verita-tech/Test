---
# Produktions-Inventory (YAML-Format, da lesbarer und typsicherer als INI).
#
# Struktur:
#   k3s_cluster
#   └── k3s_servers   -> Control-Plane-Knoten (aktuell: ein Single-Node-Server)
#   └── k3s_agents    -> spätere Worker-Knoten (aktuell leer)
#
# Der Hostname unter "hosts:" ist der Ansible-Inventory-Name und wird auch als
# Systemname (hostname) auf dem Zielsystem gesetzt.
all:
  children:
    k3s_cluster:
      children:
        k3s_servers:
          hosts:
            k3s-prod-01:
              # !!! An die tatsächliche Adresse des bereitgestellten Servers anpassen.
              ansible_host: 10.10.0.10
              # IP, auf der k3s intern lauscht (bei mehreren NICs wichtig).
              k3s_server_node_ip: 10.10.0.10

        k3s_agents:
          hosts: {}
