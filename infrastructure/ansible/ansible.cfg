# Zentrale Ansible-Konfiguration.
# Wird über die Umgebungsvariable ANSIBLE_CONFIG (siehe devcontainer.json)
# bzw. automatisch beim Arbeiten in diesem Verzeichnis geladen.
[defaults]
inventory              = inventories/production/hosts.yml
roles_path             = roles
collections_path       = ./.ansible/collections
# Ansible soll den Python-Interpreter des Zielsystems selbst ermitteln,
# ohne bei jedem Lauf eine Warnung auszugeben.
interpreter_python     = auto_silent
# Host-Key-Checking bleibt aktiv (MITM-Schutz). Neue Hosts einmalig mit
# "ssh-keyscan" in die known_hosts aufnehmen - siehe README.
host_key_checking      = True
# Lesbare Ausgabe inkl. Laufzeitmessung pro Task.
stdout_callback        = yaml
callbacks_enabled      = ansible.posix.profile_tasks, ansible.posix.timer
display_skipped_hosts  = False
forks                  = 10
retry_files_enabled    = False
# Fakten cachen, damit wiederholte Läufe schneller sind.
gathering              = smart
fact_caching           = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout   = 3600
# Vault-Passwort: bewusst NICHT fest verdrahtet, damit Läufe ohne Passwortdatei
# nicht abbrechen. Entweder pro Aufruf "--vault-password-file .vault-pass"
# nutzen oder ANSIBLE_VAULT_PASSWORD_FILE exportieren (siehe README/Makefile).
# vault_password_file  = .vault-pass
# Deprecation-Warnungen sichtbar halten - sie sind unsere Upgrade-Frühwarnung.
deprecation_warnings   = True

[privilege_escalation]
become        = False
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
# Pipelining reduziert die Anzahl der SSH-Roundtrips deutlich.
pipelining = True
# ControlMaster hält die Verbindung offen (deutlich schnellere Läufe),
# ServerAliveInterval verhindert Abbrüche bei langen Tasks (z. B. apt).
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
