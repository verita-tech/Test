---
ssh_hardening_port: 22

# Nur Mitglieder dieser Gruppen dürfen sich anmelden.
ssh_hardening_allow_groups:
  - ssh-users

# Zusätzliche, explizite Sperre einzelner Accounts (z. B. der gemeinsame
# Admin-Account, der ausschließlich lokal per su erreichbar sein soll).
ssh_hardening_deny_users: []

ssh_hardening_permit_root_login: "no"
ssh_hardening_password_authentication: "no"
ssh_hardening_max_auth_tries: 3
ssh_hardening_login_grace_time: 30
ssh_hardening_client_alive_interval: 300
ssh_hardening_client_alive_count_max: 2

# Port-Forwarding bleibt erlaubt: "kubectl port-forward" über einen SSH-Tunnel
# ist ein übliches Arbeitsmittel. Agent-Forwarding dagegen ist ein Risiko.
ssh_hardening_allow_tcp_forwarding: "yes"
ssh_hardening_allow_agent_forwarding: "no"
ssh_hardening_x11_forwarding: "no"

# Moderne Krypto-Auswahl (Stand: OpenSSH 9.x). Bewusst konservativ:
# nur Verfahren ohne bekannte Schwächen.
ssh_hardening_kex_algorithms:
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group16-sha512
ssh_hardening_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
ssh_hardening_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com

# fail2ban gegen Brute-Force-Versuche
ssh_hardening_fail2ban: true
ssh_hardening_fail2ban_maxretry: 5
ssh_hardening_fail2ban_findtime: 10m
ssh_hardening_fail2ban_bantime: 1h
# Netze, die nie gesperrt werden (Management-Netz, Monitoring).
ssh_hardening_fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
