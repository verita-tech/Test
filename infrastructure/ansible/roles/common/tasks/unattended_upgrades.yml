---
# Automatische Sicherheitsupdates.
# Bewusst nur "-security": Feature-Updates würden sonst unkontrolliert
# Dienste neu starten. Ein Reboot erfolgt nur, wenn ausdrücklich aktiviert.

- name: Unattended-Upgrades-Regeln schreiben
  ansible.builtin.template:
    src: 51-unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"
    # Prüft die apt.conf-Syntax, bevor die Datei aktiv wird.
    validate: apt-config -c %s dump

- name: Periodische APT-Läufe aktivieren
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Von Ansible verwaltet.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"
    # Prüft die apt.conf-Syntax, bevor die Datei aktiv wird.
    validate: apt-config -c %s dump

- name: Dienst unattended-upgrades aktivieren
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started
