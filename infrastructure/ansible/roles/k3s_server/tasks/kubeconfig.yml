---
# Zugriff auf /etc/rancher/k3s/k3s.yaml für die Gruppe der Cluster-Admins.
#
# K3s schreibt die Datei bei jedem Start neu und setzt dabei root:root.
# Deshalb zwei Maßnahmen:
#   1. systemd-Drop-in mit ExecStartPost -> korrigiert die Rechte bei jedem Start
#   2. einmalige Korrektur im Lauf -> wirkt sofort, ohne Neustart

- name: Systemd-Drop-in-Verzeichnis für k3s anlegen
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Rechte der kubeconfig bei jedem Dienststart korrigieren
  ansible.builtin.template:
    src: k3s-kubeconfig-permissions.conf.j2
    dest: /etc/systemd/system/k3s.service.d/10-kubeconfig-permissions.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart k3s

- name: Prüfen, ob die kubeconfig bereits existiert
  ansible.builtin.stat:
    path: /etc/rancher/k3s/k3s.yaml
  register: k3s_server_kubeconfig_stat

- name: Aktuelle Rechte der kubeconfig setzen
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    owner: root
    group: "{{ k3s_server_kubeconfig_group }}"
    mode: "{{ k3s_server_kubeconfig_mode }}"
  when: k3s_server_kubeconfig_stat.stat.exists

- name: KUBECONFIG systemweit bekannt machen
  ansible.builtin.copy:
    dest: /etc/profile.d/99-k3s.sh
    content: |
      # {{ ansible_managed }}
      # Für Mitglieder der Gruppe "{{ k3s_server_kubeconfig_group }}" ist die
      # kubeconfig lesbar; alle anderen erhalten keinen Zugriff.
      if [ -r /etc/rancher/k3s/k3s.yaml ]; then
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
      fi
      alias k=kubectl
    owner: root
    group: root
    mode: "0644"

- name: Kubeconfig für den Zugriff von außen holen
  when: k3s_server_fetch_kubeconfig | bool
  block:
    - name: Kubeconfig einlesen
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_server_kubeconfig_raw

    - name: Lokales Zielverzeichnis sicherstellen
      ansible.builtin.file:
        path: "{{ k3s_server_kubeconfig_local_path | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Kubeconfig lokal ablegen (Server-Adresse ersetzt)
      ansible.builtin.copy:
        # 127.0.0.1 gilt nur auf dem Server selbst - für den Zugriff vom
        # Arbeitsplatz muss die erreichbare Adresse eingetragen sein.
        content: >-
          {{ k3s_server_kubeconfig_raw.content | b64decode
             | replace('127.0.0.1', k3s_server_kubeconfig_external_host) }}
        dest: "{{ k3s_server_kubeconfig_local_path }}"
        mode: "0600"
      vars:
        k3s_server_kubeconfig_external_host: "{{ ansible_host | default(inventory_hostname) }}"
      delegate_to: localhost
      become: false
